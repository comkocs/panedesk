# Native inspection, scoped PTC, then native subagents and workflow.
- id: agent-default-model
  name: '@panedesk/dsh-agent-default-model'
  config:
    provider: deepseek-official
    model: deepseek-v4-pro

- id: session-persistence-jsonl
  name: '@panedesk/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: !!js 'process.env.DSH_SNAPSHOT === undefined ? ''zstd'' : ''none'''

- id: agent-instructions
  name: '@panedesk/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tools
  name: '@panedesk/dsh-tools'
  config:
    mode: native

- id: system-prompt
  name: '@panedesk/dsh-system-prompt'
  config:
    personaPrefix: |
      You are a coding assistant powered by the {{model}} model.

      Verify your work by running the code or tests. Keep answers brief and factual.

- insert:
    - id: cordis-host-runner
      name: '@panedesk/dsh-cordis-host-runner'
    - id: cordis-inspect-providers
      name: '@panedesk/dsh-tool-cordis/host'
    - id: tool-cordis
      name: '@panedesk/dsh-tool-cordis'
    - id: advanced-toolchain-presentation
      name: './presentation.mjs'
