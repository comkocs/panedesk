# Replay patch shared by the ordinary headless snapshot composition. The model
# script comes from the scenario's committed session JSONL.

- id: llm-deepseek
  name: '@panedesk/dsh-llm-deepseek-api-key'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@panedesk/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@panedesk/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@panedesk/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- insert:
    - id: subagent-model-selection-settings
      name: '@panedesk/dsh-tool-subagent/model-selection-settings'
    - id: agent-preset-registry
      name: '@panedesk/dsh-agent-preset-registry'
      config:
        default: parent
    - id: preset-parent
      name: '@panedesk/dsh-agent-preset'
      config:
        id: parent
        name: Parent
        description: Headless parent tools.
        plugins: []
    - id: preset-reviewer
      name: '@panedesk/dsh-agent-preset'
      config:
        id: reviewer
        name: Reviewer
        description: File review.
        plugins:
          - id: persona
            name: '@panedesk/dsh-persona'
            config:
              prefix: You are a file reviewer. Inspect the requested files and report your findings.
          - id: tool-fs
            name: '@panedesk/dsh-tool-fs'
          - id: tool-subagent
            name: '@panedesk/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: reviewer_delegate
              modelSelectionSettings: true
    - id: parent-agent-preset
      name: '../../../packages/test-support/session-snapshot/tests/fixtures/parent-agent-preset.ts'

- id: tool-subagent
  name: '@panedesk/dsh-tool-subagent'
  inject: [agentPresets]
  config:
    provider: spawn
    toolName: subagent
    maxDepth: 1
    allowedAgentPresets: [reviewer]
