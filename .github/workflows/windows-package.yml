name: Package Desktop · Windows

# Trial packaging on a GitHub-hosted Windows runner. Unsigned only: no signing,
# no secrets, no release publication, and no telemetry. The unsigned installer
# checks comkocs/panedesk GitHub Releases; this workflow only retains the
# generated latest.yml and blockmap beside the EXE. Hosted images move, so the
# preinstalled/installed split below cites the Windows Server 2025 image readme
# (https://github.com/actions/runner-images/blob/main/images/windows/Windows2025-Readme.md,
# image 20261101.318.1) for the windows-latest label:
#   preinstalled: Node.js 24 (cached; default on PATH is Node 22, so setup-node selects 24),
#     Visual Studio 2022 Enterprise with VC++ x64/x86 tools
#     (Microsoft.VisualStudio.Component.VC.Tools.x86.x64), Windows SDK 10.0.26100.0,
#     Python 3.12, Git, tar, PowerShell 7
#   installed here: pnpm at the version locked by packageManager (pnpm/action-setup reads it;
#     the image lists npm and yarn, not pnpm)

"on":
  workflow_dispatch:
  push:
    branches: [m9/exe-trial]

permissions:
  contents: read

concurrency:
  group: windows-desktop-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      DSH_PACKAGING_PRESET: production
      PACKAGE_VERSION_MODE: product
      PACKAGE_SIGNING: unsigned
      PANEDESK_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: Write unsigned packaging preset
        env:
          DSH_PACKAGING_CONFIG_DIR: ${{ runner.temp }}\desktop-packaging
        run: |
          "DSH_PACKAGING_CONFIG_DIR=$env:DSH_PACKAGING_CONFIG_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          $root = $env:DSH_PACKAGING_CONFIG_DIR
          New-Item -ItemType Directory -Force -Path (Join-Path $root 'presets') | Out-Null
          @(
            'DSH_DESKTOP_APP_ID=io.github.comkocs.panedesk'
            'DSH_DESKTOP_AUTO_UPDATE_ENV=production'
            "DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='{}'"
          ) | Set-Content -Encoding ascii -NoNewline:$false -Path (Join-Path $root 'presets/production.env')
      - uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE
      - name: Prepare Windows native toolchain
        working-directory: native/system
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'prepare.log'
          try { ./scripts/prepare-windows-build.ps1 *>&1 | Tee-Object -FilePath $log }
          catch { $_ | Out-String | Add-Content -Path $log; throw }
      - name: Check unsigned packaging configuration and toolchain
        run: |
          pnpm run package:desktop:win:x64:unsigned -- --check *>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'check.log')
          exit $LASTEXITCODE
      - name: Build unsigned installer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm run package:desktop:win:x64:unsigned *>&1 | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'package.log')
          exit $LASTEXITCODE
      - name: Upload unsigned installer and packaging logs
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-x64-unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: |
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/latest.yml
            apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe.blockmap
            apps/desktop/.desktop-build/packaging-runs/**
          if-no-files-found: warn
          retention-days: 3
      - name: Report failed step output
        if: failure()
        run: |
          foreach ($name in 'prepare', 'check', 'package') {
            $log = Join-Path $env:RUNNER_TEMP "$name.log"
            if (!(Test-Path $log)) { continue }
            $tail = (Get-Content -Path $log -Tail 200) -join "`n"
            $errors = (Select-String -Path $log -Pattern 'error|fatal|failed|LNK\d|ERR_' | ForEach-Object Line) -join "`n"
            # Annotations keep only the first 4096 characters, so send the end of each body.
            foreach ($item in @(@('end', $tail), @('error lines', $errors))) {
              $body = $item[1]
              if ($body.Length -gt 4000) { $body = $body.Substring($body.Length - 4000) }
              if ($body) { Write-Output ("::error title=$name $($item[0])::" + $body.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')) }
            }
            @("### $name output (last 200 lines)", '```text', $tail, '```') | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
