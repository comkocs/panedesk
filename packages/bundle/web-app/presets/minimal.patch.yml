# Agent preset minimal: one `@panedesk/dsh-agent-preset` declaration inserted
# after the web patch. Edits saved from the Web editor override this row's
# `config.plugins` by id from the profile patch.
- insert:
    - id: preset-minimal
      name: '@panedesk/dsh-agent-preset'
      config:
        id: minimal
        order: 3
        plugins:
          - id: persona
            name: '@panedesk/dsh-persona'
            config:
              prefix: You are a helpful software engineer assistant.
              complete: true
              includeRuntimeContext: false
          - id: tool-session-ops
            name: '@panedesk/dsh-tool-session-ops'
          - id: tool-panedesk-settings
            name: '@panedesk/dsh-tool-panedesk-settings'
