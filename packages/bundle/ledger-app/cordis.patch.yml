- insert:
    - id: session-ledger
      name: '@panedesk/dsh-session-ledger'
    - id: agents
      name: '@panedesk/dsh-agent'
    - id: sessions
      name: '@panedesk/dsh-session'
    - id: session-projection
      name: '@panedesk/dsh-session-projection'
    - id: session-persistence
      name: '@panedesk/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')
    - id: message-delivery
      name: '@panedesk/dsh-message-delivery-local'
      disabled: !!js "ctx.get('cmdlineArgs')?.get()[0] === 'engine'"
      inject: [sessionLedger]
      config:
        maxRecordBytes: 1048576
        maxContentBytes: 65536
        maxBatchSize: 100
        scanIntervalMs: 1000
        lockTimeoutMs: 5000
        lockRetryMs: 10
        watch: false
    - id: seat-engine-query
      name: '@panedesk/dsh-seat-engine/reader'
      disabled: !!js "!process.env.PANEDESK_SEAT_MAX_DECISION_BYTES"
      config:
        maxDecisionBytes: !!js Number(process.env.PANEDESK_SEAT_MAX_DECISION_BYTES)
    - id: ledger-query
      name: '@panedesk/dsh-ledger-query'
      inject: [sessionLedger]
    - id: ledger-app
      name: '@panedesk/dsh-ledger-app'
      inject: [sessionLedger, ledgerQuery]
      config:
        mode: !!js "ctx.get('profileContext')?.name === 'ledger-watch' ? 'watch' : 'query'"
        nodeId: !!js process.env.PANEDESK_LEDGER_NODE
