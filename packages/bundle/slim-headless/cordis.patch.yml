# The @panedesk/slim-headless bundle patch: one-shot task mode over
# @panedesk/slim-base. It restates the dsh-headless bundle patch (runner rows,
# persona, tool mode) without that patch's disables of hmr, credentials,
# authorization, and deepseek-account, rows slim-base never mounts, and adds the
# Panedesk slim defaults below (no harness identity line, no default model route). `panedesk "<task>"` (or `panedesk slim "<task>"`)
# answers one task, prints the result, and exits.

# No "powered by" harness identity line: the prompt opens with the persona.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: tools
  config:
    # Keep the same temporary process-wide PTC mode opt-in as the Web surface.
    mode: !!js process.env.PANEDESK_TOOLS_MODE

# No default model route: slim mounts only the provider-neutral pi-ai adapter
# (dormant until configured) and names no provider. Until a profile
# cordis.patch.yml or a --patch overlay restates this row (and llm-pi-ai's
# providers), the row fails with the message below instead of a request to a
# route nobody chose. Templates: examples/providers/ (Anthropic Messages,
# OpenAI chat).
- id: agent-default-model
  config:
    provider: !!js "(() => { throw new Error('no model route is configured for the slim preset. Pick an endpoint: copy a template from examples/providers/ (openai-chat.yml or anthropic-messages.yml), then pass it with --patch <file> or put its rows into $PANEDESK_HOME/profiles/slim/cordis.patch.yml') })()"
    model: unconfigured

- insert:
    - id: headless-startup
      name: '@panedesk/dsh-headless/startup'

    # Reads its task and run options from the ordinary headlessStartup provider.
    - id: headless-runner
      name: '@panedesk/dsh-headless'
      inject: [headlessStartup]
      config:
        task: !!js ctx.headlessStartup.task
        sessionId: !!js ctx.headlessStartup.sessionId
        json: !!js ctx.headlessStartup.json
        sandboxStatus: !!js ctx.headlessStartup.sandboxStatus
