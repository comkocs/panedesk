# GENERATED by scripts/panedesk/gen-slim-base.ts from packages/bundle/base/cordis.patch.yml.
# Do not edit by hand: change SLIM_BASE_ROWS in the script and re-run it.
#
# The @panedesk/slim-base bundle patch: a verbatim row subset of dsh-base,
# applied as ONE insert over the empty profile root. It keeps the minimal
# headless core plus compaction, output spill, the tool-call timeout guard, and
# AGENTS.md loading. Rows absent here (Web/API gateway, telemetry, DeepSeek
# account and request extensions, skills, goals, workflow, web tools, ...) are
# what the full preset adds back through @panedesk/dsh-base.

- insert:
    - id: llm
      name: '@panedesk/dsh-llm'

    - id: session
      name: '@panedesk/dsh-session'

    - id: agent
      name: '@panedesk/dsh-agent'

    # The transport-independent default for Agents created by entry points.
    # Settings may supply a saved selection; consumers read it at creation time.
    - id: agent-default-model
      name: '@panedesk/dsh-agent-default-model'
      config:
        provider: deepseek-official
        model: deepseek-flash

    - id: llm-retry
      name: '@panedesk/dsh-llm-retry'

    # The pi-ai multi-provider twin, mounted dormant: zero routes (and no extra
    # models in the picker) until a `llm-pi-ai:` settings section supplies provider
    # profiles — then those routes register live, keys resolving per request
    # through their apiKeyEnv references, and drop again when the section empties.
    # Supplying those profiles is exactly what the web Models page does. Which
    # adapters exist is composition; which providers run is the user's settings
    # document.
    - id: llm-pi-ai
      name: '@panedesk/dsh-llm-pi-ai'

    - id: session-persistence-jsonl
      name: '@panedesk/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')

    # Shared projection registry: subagent catalog identity (mode/label) folds
    # through its registered units, so the `list_agents` surface below fails
    # loud without it; web layers reuse this same mount for list rows.
    - id: working-directory
      name: '@panedesk/dsh-working-directory'

    - id: session-projection
      name: '@panedesk/dsh-session-projection'

    - id: subprocess
      name: '@panedesk/dsh-subprocess-local'

    # Every shipped CLI mode starts with the same file-effect boundary.
    # The environment remains an explicit deployment override; otherwise fresh
    # sessions pin workspace-write + ask through the permission service below.
    - id: sandbox
      name: '@panedesk/dsh-sandbox-local'

    - id: sandbox-policy
      name: '@panedesk/dsh-sandbox-policy'
      config:
        mode: !!js process.env.PANEDESK_PERMISSION_MODE ?? 'workspace-write'
        workspaceRoot: !!js process.cwd()

    - id: bash-sandbox
      name: '@panedesk/dsh-bash-sandbox'
      disabled: !!js process.platform === 'win32'
      config:
        timeoutMs: 60000

    - id: pwsh-sandbox
      name: '@panedesk/dsh-pwsh-sandbox'
      disabled: !!js process.platform !== 'win32'

    - id: approval
      name: '@panedesk/dsh-user-approval'
      config:
        policy: !!js "(process.env.PANEDESK_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

    - id: permission
      name: '@panedesk/dsh-permission-presets'
      config:
        presets:
          read-only:
            sandbox: read-only
            approval: ask
          workspace-write:
            sandbox: workspace-write
            approval: ask
          danger-full-access:
            sandbox: danger-full-access
            approval: never

    - id: shell-env
      name: '@panedesk/dsh-shell-env'

    - id: tool-bash
      name: '@panedesk/dsh-tool-bash'
      disabled: !!js process.platform === 'win32'

    - id: tool-pwsh
      name: '@panedesk/dsh-tool-pwsh'
      disabled: !!js process.platform !== 'win32'

    - id: fs-observation-policy
      name: '@panedesk/dsh-fs-observation-policy'

    - id: tool-fs
      name: '@panedesk/dsh-tool-fs'

    - id: tool-fs-search
      name: '@panedesk/dsh-tool-fs-search'
      config:
        sampleOverCapGlobResults: false

    - id: agent-instructions
      name: '@panedesk/dsh-agent-instructions'
      config:
        maxBytes: 65536

    - id: token-meter
      name: '@panedesk/dsh-token-meter'

    - id: compaction-basic
      name: '@panedesk/dsh-compaction-basic'

    - id: subagent
      name: '@panedesk/dsh-subagent'

    - id: subagent-spawn-in-process
      name: '@panedesk/dsh-subagent-spawn-in-process'
      config:
        providerName: spawn

    - id: tool-subagent
      name: '@panedesk/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent

    - id: timeout-policy
      name: '@panedesk/dsh-tool-call-timeout-policy'

    - id: spill-local
      name: '@panedesk/dsh-spill-local'

    - id: spill-policy
      name: '@panedesk/dsh-spill-policy'
      config:
        maxInlineTokens: 12500

    # Durability checkpoints before each model request and top-level dispatch.
    - id: session-checkpoint-policy
      name: '@panedesk/dsh-session-checkpoint-policy'

    # Compacts oversized tool results before the broader conversation compactor
    # runs, preserving the model-visible result within the configured budget.
    - id: tool-result-pruner
      name: '@panedesk/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

    # ── rows every mode mounts, whose values each overlay may state ──────────────

    # The tool registry. Presentation mode is a deployment choice; omitting it here
    # keeps the schema default (native).
    - id: tools
      name: '@panedesk/dsh-tools'

    # The deployment persona is a deployment choice; plan-mode and tool plugins own
    # their own prompt sections.
    - id: system-prompt
      name: '@panedesk/dsh-system-prompt'
      config:
        personaPrefix: ''

    # Agents created at startup. The base stays empty; raw overlays may create
    # agents, while Web creates sessions on client request.
    - id: agent-loop
      name: '@panedesk/dsh-agent-loop'
      config:
        agents: []

    # The sandboxed filesystem provider. `cwd` defaults to `process.cwd()`; an
    # overlay can pin another workspace.
    - id: fs-sandbox
      name: '@panedesk/dsh-fs-sandbox'
