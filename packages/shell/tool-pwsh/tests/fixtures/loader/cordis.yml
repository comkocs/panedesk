# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@panedesk/dsh-system-prompt'

- id: fs
  name: '@panedesk/dsh-fs-local'

- id: session-projections
  name: '@panedesk/dsh-session-projection'

- id: working-directory
  name: '@panedesk/dsh-working-directory'

- id: tools
  name: '@panedesk/dsh-tools'

- id: subprocess
  name: '@panedesk/dsh-subprocess-local'

- id: bash
  name: '@panedesk/dsh-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@panedesk/dsh-shell-env'

- id: tasks
  name: '@panedesk/dsh-jobs-local'

- id: tool-jobs
  name: '@panedesk/dsh-tool-jobs'

- id: tool-pwsh
  name: '@panedesk/dsh-tool-pwsh'
