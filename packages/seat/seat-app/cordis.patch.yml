# Seat execution is opt-in; supply deployment policy before enabling the engine.
- id: hmr
  disabled: true

- insert:
    - id: seat-session-ledger
      name: '@panedesk/dsh-session-ledger'
    - id: seat-schedule
      name: '@panedesk/dsh-schedule'
    - id: seat-engine
      name: '@panedesk/dsh-seat-engine'
      disabled: true
    - id: seat-local
      name: '@panedesk/dsh-seat-local'
      # Help only prints application usage; operational invocations still require explicit deployment configuration.
      disabled: !!js "ctx.get('cmdlineArgs')?.get().length === 1 && ['--help', '-h'].includes(ctx.get('cmdlineArgs')?.get()[0])"
    - id: seat-gates
      name: '@panedesk/dsh-seat-gates'
    - id: tool-seat
      name: '@panedesk/dsh-tool-seat'
    - id: seat-remote
      name: '@panedesk/dsh-seat-remote'
    - id: seat-app
      name: '@panedesk/dsh-seat-app'
