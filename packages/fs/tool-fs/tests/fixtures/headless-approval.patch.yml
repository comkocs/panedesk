- id: llm-cache
  disabled: true
- id: session-ledger-full
  disabled: true
- id: session-title-llm
  disabled: true
- id: agent-default-model
  config:
    provider: headless-approval
    model: scripted
- id: sandbox-policy
  disabled: true
- id: sandbox
  disabled: true
- id: approval
  config:
    policy: ask
    workspaceWriteTimeoutMs: 5000
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
- insert:
    - id: headless-approval-attempt
      name: ./headless-approval.mjs
